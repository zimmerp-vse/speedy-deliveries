<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dash Delivery — Embed Test Host</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 12px 16px; border-bottom: 1px solid #1e293b; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 12px; padding: 12px; height: calc(100vh - 48px); box-sizing: border-box; }
  iframe { width: 100%; height: 100%; border: 1px solid #1e293b; border-radius: 8px; background: #000; }
  #log { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; }
  .row { margin-bottom: 6px; padding: 4px 6px; border-radius: 4px; background: #0b1220; }
  button { background: #2563eb; color: white; border: 0; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <strong>Master Platform Mock</strong>
  &nbsp;<button id="quitBtn">Send QUIT</button>
</header>
<main>
  <iframe id="game" src="/"></iframe>
  <div id="log"></div>
</main>
<script>
  const log = document.getElementById('log');
  const frame = document.getElementById('game');
  const sessionId = crypto.randomUUID();
  const append = (label, data) => {
    const div = document.createElement('div');
    div.className = 'row';
    div.textContent = `[${new Date().toLocaleTimeString()}] ${label}: ${JSON.stringify(data)}`;
    log.prepend(div);
  };

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.source !== 'dash-delivery') return;
    append(d.type, d.payload);
    if (d.type === 'READY') {
      frame.contentWindow.postMessage({
        source: 'dash-delivery',
        type: 'INIT',
        version: 1,
        payload: {
          session: { sessionId },
          player: { nickname: 'Alice', id: 'u-42' },
          difficulty: {
            totalRounds: 3,
            tripDurationMs: 30000,
            carSpawnRate: 0.05,
            obstacleSpawnRate: 0.01,
            pedestrianSpawnRate: 0.005,
            malfunctionProbability: 0.5,
            malfunctionFirstWindowSec: { min: 5, max: 12 },
          },
          economy: {
            startingMoney: 1000,
            deliveryReward: 750,
            carCollisionCost: 400,
            obstacleCollisionCost: 250,
            pedestrianCollisionCost: 200,
            malfunctionCost: 300,
          },
          ui: { showQuitButton: true },
          extra: { questId: 'demo-quest-1' },
        }
      }, '*');
    }
  });

  document.getElementById('quitBtn').addEventListener('click', () => {
    frame.contentWindow.postMessage({ source: 'dash-delivery', type: 'QUIT', version: 1 }, '*');
  });
</script>
</body>
</html>
